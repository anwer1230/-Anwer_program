services:
  - type: web
    name: smart-academic-hub
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
