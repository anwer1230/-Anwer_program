<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منسّق المستندات الاحترافي</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#1a5c3a;--secondary:#2d8653;--accent:#40a96a;
  --bg:#f0f7f4;--card:#fff;--border:#d1e8db;--text:#1e2d26;--muted:#5a7a68;
}
body{background:var(--bg);font-family:'Segoe UI',Tahoma,sans-serif;font-size:14px;color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.topbar h1{font-size:15px;font-weight:700;}
.topbar p{font-size:11px;opacity:.85;margin-top:1px;}
.badge-row{display:flex;gap:6px;margin-right:auto;}
.badge{background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.3);border-radius:12px;padding:2px 10px;font-size:11px;}
.main{display:flex;flex:1;overflow:hidden;}
.left-panel{width:290px;flex-shrink:0;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.panel-header{background:var(--primary);color:#fff;padding:10px 14px;font-size:13px;font-weight:700;}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:18px;text-align:center;cursor:pointer;transition:.2s;background:#f8fdf9;margin:12px;}
.upload-zone:hover{border-color:var(--accent);background:#f0fdf4;}
.upload-zone .icon{font-size:30px;margin-bottom:5px;}
.upload-zone strong{display:block;color:var(--primary);font-size:13px;margin-bottom:3px;}
.upload-zone small{color:var(--muted);font-size:11px;}
.file-info{margin:0 12px 10px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:9px;font-size:12px;display:none;}
.file-info .fname{font-weight:700;color:var(--primary);word-break:break-all;}
.file-info .fsize{color:var(--muted);margin-top:2px;}
.section-title{padding:7px 14px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:#f8fdf9;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.format-options{padding:10px;flex:1;overflow-y:auto;}
.opt-group{margin-bottom:12px;}
.opt-group label{display:block;font-size:12px;font-weight:700;color:var(--primary);margin-bottom:4px;}
.opt-row{display:flex;gap:5px;flex-wrap:wrap;}
.opt-btn{background:#f0f7f4;border:1.5px solid var(--border);color:var(--primary);border-radius:7px;padding:4px 9px;font-size:11px;cursor:pointer;transition:.15s;font-family:inherit;}
.opt-btn:hover,.opt-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
select.form-sel{width:100%;padding:5px 9px;border:1.5px solid var(--border);border-radius:7px;font-family:inherit;font-size:12px;color:var(--text);background:#fff;}
input[type=range]{width:100%;accent-color:var(--accent);}
.status-bar{padding:7px 14px;font-size:12px;background:#eff6ff;border-top:1px solid #bfdbfe;color:#1e40af;display:none;}
.status-bar.error{background:#fee2e2;border-color:#fca5a5;color:#991b1b;}
.status-bar.success{background:#d1fae5;border-color:#6ee7b7;color:#065f46;}
.actions{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:5px;}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;border:none;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit;width:100%;}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,0.12);}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary);}
.btn-warn{background:linear-gradient(135deg,#b45309,#d97706);color:#fff;}
.btn-row{display:flex;gap:5px;}
.btn-row .btn{flex:1;}
.right-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.toolbar{background:#fff;border-bottom:1px solid var(--border);padding:5px 10px;display:flex;align-items:center;gap:3px;flex-wrap:wrap;flex-shrink:0;}
.tb-btn{background:none;border:1px solid transparent;border-radius:5px;padding:4px 7px;font-size:13px;cursor:pointer;color:var(--text);transition:.15s;font-family:inherit;}
.tb-btn:hover{background:#f0f7f4;border-color:var(--border);}
.tb-sep{width:1px;height:18px;background:var(--border);margin:0 3px;}
.view-tabs{display:flex;border-bottom:1px solid var(--border);background:#fff;flex-shrink:0;}
.view-tab{padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:.15s;}
.view-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.editor-area{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center;}
.doc-page{background:#fff;width:100%;max-width:820px;min-height:400px;padding:36px 46px;box-shadow:0 2px 18px rgba(0,0,0,0.1);border-radius:4px;outline:none;font-size:14px;line-height:1.8;color:#1e2d26;}
.doc-page:empty::before{content:'افتح ملفاً لعرض محتواه، أو ابدأ الكتابة مباشرة...';color:#9ca3af;font-style:italic;}
.preview-area{flex:1;overflow:auto;padding:16px;display:none;justify-content:center;}
.preview-area.active{display:flex;}
.preview-doc{background:#fff;max-width:820px;width:100%;padding:36px 46px;box-shadow:0 2px 18px rgba(0,0,0,0.1);border-radius:4px;line-height:1.8;}
.find-bar{background:#fffbeb;border-top:1px solid #fde68a;padding:6px 12px;display:none;align-items:center;gap:6px;flex-shrink:0;}
.find-bar input{border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;font-family:inherit;width:130px;}
.find-bar .fb-btn{background:var(--primary);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;}
.find-bar .fb-close{background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);margin-right:auto;}
.word-count{padding:5px 14px;background:#f8fdf9;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;gap:14px;flex-shrink:0;}
.loading{position:fixed;inset:0;background:rgba(255,255,255,0.88);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
.spinner{width:38px;height:38px;border:4px solid #d1fae5;border-top:4px solid var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading p{color:var(--primary);font-weight:700;}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>📝 منسّق المستندات الاحترافي</h1>
    <p>فتح · تحرير · تنسيق · تصدير</p>
  </div>
  <div class="badge-row">
    <span class="badge">📄 PDF</span>
    <span class="badge">📝 Word</span>
    <span class="badge">🗒️ TXT</span>
  </div>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p id="loadingMsg">جاري معالجة الملف...</p>
</div>

<div class="main">
  <div class="left-panel">
    <div class="panel-header">📁 الملف والإعدادات</div>

    <div class="upload-zone" id="uploadZone"
         onclick="document.getElementById('fileInput').click()"
         ondragover="event.preventDefault();this.style.borderColor='var(--accent)'"
         ondragleave="this.style.borderColor=''"
         ondrop="handleDrop(event)">
      <div class="icon">📂</div>
      <strong>اسحب ملفاً أو انقر للاختيار</strong>
      <small>PDF · Word (.docx) · TXT</small>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.txt,.rtf" style="display:none" onchange="handleFile(this.files[0])">

    <div class="file-info" id="fileInfo">
      <div class="fname" id="fileName"></div>
      <div class="fsize" id="fileSize"></div>
    </div>

    <div class="section-title">🎨 تنسيق النص</div>
    <div class="format-options">
      <div class="opt-group">
        <label>الخط</label>
        <select class="form-sel" onchange="applyFont(this.value)">
          <option value="'Segoe UI',Tahoma,sans-serif">Segoe UI (افتراضي)</option>
          <option value="'Times New Roman',serif">Times New Roman</option>
          <option value="'Arial',sans-serif">Arial</option>
          <option value="'Courier New',monospace">Courier New</option>
          <option value="'Georgia',serif">Georgia</option>
          <option value="'Tahoma',sans-serif">Tahoma</option>
          <option value="'Calibri',sans-serif">Calibri</option>
        </select>
      </div>
      <div class="opt-group">
        <label>حجم الخط: <span id="fontSizeVal">14</span>px</label>
        <input type="range" min="10" max="28" value="14" oninput="applyFontSize(this.value)">
      </div>
      <div class="opt-group">
        <label>المحاذاة</label>
        <div class="opt-row">
          <button class="opt-btn" onclick="setAlign('right')">⬅ يمين</button>
          <button class="opt-btn" onclick="setAlign('center')">وسط</button>
          <button class="opt-btn" onclick="setAlign('left')">يسار ➡</button>
          <button class="opt-btn" onclick="setAlign('justify')">ضبط</button>
        </div>
      </div>
      <div class="opt-group">
        <label>تباعد الأسطر</label>
        <select class="form-sel" onchange="applyLineHeight(this.value)">
          <option value="1.5">مضغوط (1.5)</option>
          <option value="1.8" selected>عادي (1.8)</option>
          <option value="2.0">مريح (2.0)</option>
          <option value="2.5">واسع (2.5)</option>
        </select>
      </div>
      <div class="opt-group">
        <label>اتجاه الكتابة</label>
        <div class="opt-row">
          <button class="opt-btn active" id="dirRtl" onclick="setDir('rtl')">← عربي RTL</button>
          <button class="opt-btn" id="dirLtr" onclick="setDir('ltr')">LTR إنجليزي →</button>
        </div>
      </div>
      <div class="opt-group">
        <label>الثيم</label>
        <div class="opt-row">
          <button class="opt-btn active" onclick="setTheme('white')">⬜ أبيض</button>
          <button class="opt-btn" onclick="setTheme('cream')">🟡 كريمي</button>
          <button class="opt-btn" onclick="setTheme('dark')">⬛ داكن</button>
        </div>
      </div>
    </div>

    <div id="statusBar" class="status-bar"></div>

    <div class="actions">
      <div class="btn-row">
        <button class="btn btn-outline" onclick="clearEditor()">🗑️ مسح</button>
        <button class="btn btn-outline" onclick="toggleFind()">🔍 بحث</button>
      </div>
      <button class="btn btn-primary" onclick="copyAll()">📋 نسخ كل النص</button>
      <div class="btn-row">
        <button class="btn btn-warn" onclick="exportTxt()">⬇️ TXT</button>
        <button class="btn btn-warn" onclick="exportHtml()">⬇️ HTML</button>
        <button class="btn btn-warn" onclick="exportPdf()">⬇️ PDF</button>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="toolbar">
      <button class="tb-btn" onclick="fmt('bold')"><b>B</b></button>
      <button class="tb-btn" onclick="fmt('italic')"><i>I</i></button>
      <button class="tb-btn" onclick="fmt('underline')"><u>U</u></button>
      <button class="tb-btn" onclick="fmt('strikeThrough')"><s>S</s></button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="insertHeading(1)">H1</button>
      <button class="tb-btn" onclick="insertHeading(2)">H2</button>
      <button class="tb-btn" onclick="insertHeading(3)">H3</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="fmt('insertUnorderedList')">• قائمة</button>
      <button class="tb-btn" onclick="fmt('insertOrderedList')">1. مرقّم</button>
      <div class="tb-sep"></div>
      <input type="color" value="#000000" title="لون النص" onchange="fmt('foreColor',this.value)"
        style="width:26px;height:26px;border:1px solid var(--border);border-radius:4px;cursor:pointer;padding:2px;">
      <input type="color" value="#ffff00" title="تظليل" onchange="fmt('hiliteColor',this.value)"
        style="width:26px;height:26px;border:1px solid var(--border);border-radius:4px;cursor:pointer;padding:2px;">
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="fmt('removeFormat')">✕ إزالة التنسيق</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="document.execCommand('undo')">↩</button>
      <button class="tb-btn" onclick="document.execCommand('redo')">↪</button>
    </div>

    <div class="find-bar" id="findBar">
      <span>🔍</span>
      <input type="text" id="findInput" placeholder="ابحث...">
      <span>←</span>
      <input type="text" id="replaceInput" placeholder="استبدل بـ...">
      <button class="fb-btn" onclick="doFind()">بحث</button>
      <button class="fb-btn" onclick="doReplace()">استبدال</button>
      <button class="fb-btn" onclick="doReplaceAll()">استبدال الكل</button>
      <button class="fb-close" onclick="toggleFind()">✕</button>
    </div>

    <div class="view-tabs">
      <div class="view-tab active" onclick="switchView('edit',this)">✏️ تحرير</div>
      <div class="view-tab" onclick="switchView('preview',this)">👁️ معاينة</div>
    </div>

    <div class="editor-area" id="editorArea">
      <div class="doc-page" id="editor" contenteditable="true" spellcheck="true" oninput="updateWordCount()"></div>
    </div>

    <div class="preview-area" id="previewArea">
      <div class="preview-doc" id="previewDoc"></div>
    </div>

    <div class="word-count">
      <span>📝 الكلمات: <b id="wc">0</b></span>
      <span>🔤 الأحرف: <b id="cc">0</b></span>
      <span>📄 الفقرات: <b id="pc">0</b></span>
      <span>📏 الأسطر: <b id="lc">0</b></span>
    </div>
  </div>
</div>

<script>
if(typeof pdfjsLib !== 'undefined')
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const editor = document.getElementById('editor');

function handleDrop(e){
  e.preventDefault();
  document.getElementById('uploadZone').style.borderColor='';
  const f = e.dataTransfer.files[0];
  if(f) handleFile(f);
}

async function handleFile(file){
  if(!file) return;
  showLoading('جاري قراءة الملف...');
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileSize').textContent = formatSize(file.size);
  document.getElementById('fileInfo').style.display = 'block';
  try {
    const ext = file.name.split('.').pop().toLowerCase();
    if(ext === 'pdf') await readPdf(file);
    else if(ext === 'docx' || ext === 'doc') await readDocx(file);
    else if(['txt','rtf','md'].includes(ext)) await readTxt(file);
    else showStatus('نوع الملف غير مدعوم. الأنواع المدعومة: PDF, Word, TXT', 'error');
    updateWordCount();
    showStatus('✅ تم فتح: ' + file.name, 'success');
  } catch(err){
    showStatus('❌ خطأ: ' + err.message, 'error');
  }
  hideLoading();
}

async function readPdf(file){
  showLoading('جاري استخراج نص PDF...');
  const ab = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: ab}).promise;
  let text = '';
  for(let i=1; i<=pdf.numPages; i++){
    showLoading('صفحة ' + i + ' من ' + pdf.numPages + '...');
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(x=>x.str).join(' ') + '\n\n';
  }
  editor.innerHTML = textToHtml(text.trim());
}

async function readDocx(file){
  showLoading('جاري قراءة ملف Word...');
  const ab = await file.arrayBuffer();
  const result = await mammoth.convertToHtml({arrayBuffer: ab});
  editor.innerHTML = result.value || '<p>الملف فارغ.</p>';
}

async function readTxt(file){
  const text = await file.text();
  editor.innerHTML = textToHtml(text);
}

function textToHtml(text){
  return text.split('\n').map(line =>
    line.trim() ? '<p>' + esc(line) + '</p>' : '<br>'
  ).join('');
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatSize(b){ return b>1048576?`${(b/1048576).toFixed(1)} MB`:b>1024?`${(b/1024).toFixed(0)} KB`:`${b} B`; }

function fmt(cmd,val=null){ document.execCommand(cmd,false,val); editor.focus(); }
function applyFont(f){ editor.style.fontFamily=f; }
function applyFontSize(v){ document.getElementById('fontSizeVal').textContent=v; editor.style.fontSize=v+'px'; }
function applyLineHeight(v){ editor.style.lineHeight=v; }
function setAlign(a){ editor.style.textAlign=a; }
function setDir(d){
  editor.style.direction=d;
  document.getElementById('dirRtl').classList.toggle('active',d==='rtl');
  document.getElementById('dirLtr').classList.toggle('active',d==='ltr');
}
function setTheme(t){
  const th={white:{bg:'#fff',c:'#1e2d26'},cream:{bg:'#fdf6e3',c:'#2d2006'},dark:{bg:'#1e1e2e',c:'#cdd6f4'}}[t];
  editor.style.background=th.bg; editor.style.color=th.c;
  document.getElementById('previewDoc').style.background=th.bg;
  document.getElementById('previewDoc').style.color=th.c;
}
function insertHeading(n){
  const sel=window.getSelection();
  if(!sel.rangeCount) return;
  const r=sel.getRangeAt(0);
  const h=document.createElement('h'+n);
  h.innerHTML=sel.toString()||'عنوان';
  r.deleteContents(); r.insertNode(h);
}

function switchView(v,el){
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const ea=document.getElementById('editorArea');
  const pa=document.getElementById('previewArea');
  if(v==='edit'){ ea.style.display='flex'; pa.classList.remove('active'); }
  else { ea.style.display='none'; pa.classList.add('active'); document.getElementById('previewDoc').innerHTML=editor.innerHTML; }
}

function toggleFind(){
  const bar=document.getElementById('findBar');
  const vis=bar.style.display==='flex';
  bar.style.display=vis?'none':'flex';
  if(!vis) document.getElementById('findInput').focus();
}
function doFind(){ const q=document.getElementById('findInput').value; if(q) window.find(q); }
function doReplace(){
  const q=document.getElementById('findInput').value;
  const r=document.getElementById('replaceInput').value;
  if(!q) return;
  const h=editor.innerHTML; const i=h.indexOf(q);
  if(i>=0){ editor.innerHTML=h.substring(0,i)+r+h.substring(i+q.length); updateWordCount(); }
}
function doReplaceAll(){
  const q=document.getElementById('findInput').value;
  const r=document.getElementById('replaceInput').value;
  if(!q) return;
  editor.innerHTML=editor.innerHTML.split(q).join(r);
  updateWordCount(); showStatus('✅ تم استبدال كل مواضع "'+q+'"','success');
}

function updateWordCount(){
  const text=editor.innerText||'';
  document.getElementById('wc').textContent=text.trim()?text.trim().split(/\s+/).length:0;
  document.getElementById('cc').textContent=text.length;
  document.getElementById('lc').textContent=text.split('\n').length;
  document.getElementById('pc').textContent=editor.querySelectorAll('p,h1,h2,h3').length||1;
}

function clearEditor(){
  if(!editor.innerText.trim()||confirm('هل أنت متأكد من مسح كل المحتوى؟')){
    editor.innerHTML=''; document.getElementById('fileInfo').style.display='none'; updateWordCount();
  }
}
function copyAll(){
  const text=editor.innerText;
  navigator.clipboard.writeText(text)
    .then(()=>showStatus('✅ تم نسخ النص','success'))
    .catch(()=>{ const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showStatus('✅ تم النسخ','success'); });
}
function exportTxt(){
  download(new Blob([editor.innerText],{type:'text/plain;charset=utf-8'}),'document.txt');
}
function exportHtml(){
  const dir=editor.style.direction||'rtl';
  const html=`<!DOCTYPE html><html dir="${dir}"><head><meta charset="UTF-8"><style>body{font-family:inherit;direction:${dir};font-size:${editor.style.fontSize||'14px'};line-height:${editor.style.lineHeight||'1.8'};padding:40px;max-width:800px;margin:auto;}</style></head><body>${editor.innerHTML}</body></html>`;
  download(new Blob([html],{type:'text/html;charset=utf-8'}),'document.html');
}
async function exportPdf(){
  showLoading('جاري إنشاء PDF...');
  try {
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
    pdf.html(editor,{
      callback:(doc)=>{doc.save('document.pdf');hideLoading();showStatus('✅ تم تصدير PDF','success');},
      x:15,y:15,width:180,windowWidth:800
    });
  } catch(e){
    hideLoading();
    try {
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF();
      const lines=pdf.splitTextToSize(editor.innerText,180);
      pdf.text(lines,15,15);
      pdf.save('document.pdf');
      showStatus('✅ تم تصدير PDF (نص فقط)','success');
    } catch(e2){ showStatus('❌ خطأ في تصدير PDF','error'); }
  }
}
function download(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  showStatus('✅ جاري تحميل: '+name,'success');
}

let stTimer;
function showStatus(msg,type=''){
  const bar=document.getElementById('statusBar');
  bar.textContent=msg; bar.className='status-bar'+(type?' '+type:'');
  bar.style.display='block';
  clearTimeout(stTimer); stTimer=setTimeout(()=>bar.style.display='none',5000);
}
function showLoading(msg){ document.getElementById('loadingMsg').textContent=msg; document.getElementById('loading').style.display='flex'; }
function hideLoading(){ document.getElementById('loading').style.display='none'; }

editor.addEventListener('paste',e=>{
  e.preventDefault();
  const text=e.clipboardData.getData('text/plain');
  document.execCommand('insertText',false,text);
});
updateWordCount();
</script>
